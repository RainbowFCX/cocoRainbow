<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>地球地图 - 可缩放拖拽全球地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 可选：更好看的地图插件（搜索功能） -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        body { margin:0; padding:0; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 搜索插件（可选，但非常好用） -->
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
// 初始化地图（初始中心点设为中国，缩放级别可自行调整）
var map = L.map('map').setView([35.0, 105.0], 4);

// OpenStreetMap 底图（免费）
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap 贡献者',
    maxZoom: 19
}).addTo(map);

// 可选：添加多种精美底图切换（卫星、街道、地形等）
var baseMaps = {
    "街道图（OpenStreetMap）": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
    "卫星图（ESRI）": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © ESRI'
    }),
    "地形图（OpenTopoMap）": L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenTopoMap'
    })
};

// 当前只显示一个，也可以打开下面这行启用底图切换控件
// L.control.layers(baseMaps).addTo(map);

// 添加搜索框（可以直接搜索城市、地址、景点）
L.Control.geocoder({
    defaultMarkGeocode: true,
    placeholder: "搜索地点（如：北京、上海、巴黎）...",
    errorMessage: "未找到该地点"
}).addTo(map);

// 可选：双击地图添加标记
map.on('dblclick', function(e) {
    L.marker(e.latlng).addTo(map)
        .bindPopup("纬度: " + e.latlng.lat.toFixed(4) + "<br>经度: " + e.latlng.lng.toFixed(4))
        .openPopup();
});

// 提示
alert("地图加载完成！\n- 鼠标滚轮缩放\n- 拖拽移动\n- 右上角搜索框可直接搜索全球地点\n- 双击地图任意位置可添加标记");
</script>

</body>
</html>
